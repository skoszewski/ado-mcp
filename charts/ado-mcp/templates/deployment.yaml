apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      containers:
        - name: ado-mcp
          image: {{ .Values.image }}
          args: ["--port", "{{ .Values.port }}"]
          envFrom:
            - secretRef:
                name: {{ .Values.secretName }}
          ports:
            - containerPort: {{ .Values.port }}
